name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The GITHUB_TOKEN reads the repo; only the deploy job, which runs no code of the repo's dependencies, may publish
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the Bun of package.json's packageManager, which setup-bun reads: the one bun.lock is written with, so the frozen
      # install reads it the same way
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        # .env.local stays on the laptop, so the build takes the TMDB token from the repo's Actions secrets. Vite writes
        # it into the page's JavaScript, where anyone can read it, as with any key a page uses to call an API itself.
        # No MDBList key: a free one allows 1000 requests a day, which every visitor would share; each puts their own
        # in Settings (src/lib/keys.ts).
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}

      # Pages answers any path it has no file for with 404.html. Making that the app means a link to a title page
      # (/hoshizora/tv/1399) or a reload there opens the app, whose router then reads the address.
      - name: Open deep links in the app
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite's build output dir (CRA used ./build)
          path: ./dist
  
  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4