[package]
name = "hoshizora"
version = "0.1.0"
description = "放映室：自用的 Emby 播放器"
authors = ["Bin"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "hoshizora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

# emby-core is its own crate, so its tests run without building Tauri (docs/playback-plan.md)
[workspace]
members = ["emby-core"]

[dependencies]
tauri = { version = "2.12.1", features = [] }
emby-core = { path = "emby-core" }
