[package]
name = "hoshizora"
description = "放映室：自用的 Emby 播放器"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "hoshizora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

# emby-core is its own crate, so its tests run without building Tauri (docs/playback-plan.md)
[workspace]
members = ["emby-core"]

# one version for both, which is the app's (the bundle's, as tauri.conf.json names none) and what emby-core tells servers
[workspace.package]
version = "0.1.0"
authors = ["Bin"]
edition = "2024"
rust-version = "1.90"

[dependencies]
# held to 2.12 as @tauri-apps/api and the CLI are (package.json): the CLI won't build with them a minor apart
tauri = { version = "~2.12.1", features = [] }
emby-core = { path = "emby-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the player's window: its picture, an OpenGL layer under the page (src/player/layer.rs), and the Mac's symbols its
# controls are drawn with (src/player/symbol.rs), the versions Tauri's own use
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSGraphics", "NSScreen", "NSAnimation", "NSAnimationContext", "NSButton", "NSControl", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSColor", "NSFontDescriptor", "block2", "objc2-quartz-core", "NSColorSpace", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSObject", "NSGeometry", "NSProcessInfo", "NSString", "NSArray", "NSData", "NSDictionary", "NSValue"] }
# the Mac's media keys and 正在播放 (src/player/now.rs)
objc2-media-player = { version = "0.3", features = ["MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "block2"] }
# the title bar's fade (src/player/mod.rs)
block2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAOpenGLLayer", "CATransaction"] }
# the picture's colours: the screen's, or HDR's PQ (src/player/colour.rs)
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
